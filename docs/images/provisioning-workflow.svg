<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-labelledby="title desc">
<title id="title">Terraform provisioning workflow</title><desc id="desc">Review variables, format, initialize without backend, validate, run Checkov, review plan and cost, then require human approval before an operator applies changes.</desc>
<rect width="1100" height="340" rx="22" fill="#0b1220"/><text x="42" y="48" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#f8fafc">Provisioning &amp; Review Workflow</text><defs><marker id="tw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="18" y="115" width="118" height="78" rx="11" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/><text x="77" y="145" font-size="13" fill="#f8fafc"><tspan x="77" dy="0">Review inputs</tspan></text><rect x="154" y="115" width="118" height="78" rx="11" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/><text x="213" y="145" font-size="13" fill="#f8fafc"><tspan x="213" dy="0">terraform fmt</tspan></text><rect x="290" y="115" width="118" height="78" rx="11" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/><text x="349" y="145" font-size="13" fill="#f8fafc"><tspan x="349" dy="0">init\n-backend=false</tspan></text><rect x="426" y="115" width="118" height="78" rx="11" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/><text x="485" y="145" font-size="13" fill="#f8fafc"><tspan x="485" dy="0">terraform\nvalidate</tspan></text><rect x="562" y="115" width="118" height="78" rx="11" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/><text x="621" y="145" font-size="13" fill="#f8fafc"><tspan x="621" dy="0">Checkov scan</tspan></text><rect x="698" y="115" width="118" height="78" rx="11" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/><text x="757" y="145" font-size="13" fill="#f8fafc"><tspan x="757" dy="0">Review plan\n+ cost</tspan></text><rect x="834" y="115" width="118" height="78" rx="11" fill="#422006" stroke="#f59e0b" stroke-width="2"/><text x="893" y="145" font-size="13" fill="#f8fafc"><tspan x="893" dy="0">Human\napproval?</tspan></text><rect x="970" y="115" width="118" height="78" rx="11" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="1029" y="145" font-size="13" fill="#f8fafc"><tspan x="1029" dy="0">Operator-run\napply</tspan></text>
<path d="M136 154 H146" stroke="#a78bfa" stroke-width="2.5" fill="none" marker-end="url(#tw)"/><path d="M272 154 H282" stroke="#a78bfa" stroke-width="2.5" fill="none" marker-end="url(#tw)"/><path d="M408 154 H418" stroke="#a78bfa" stroke-width="2.5" fill="none" marker-end="url(#tw)"/><path d="M544 154 H554" stroke="#a78bfa" stroke-width="2.5" fill="none" marker-end="url(#tw)"/><path d="M680 154 H690" stroke="#a78bfa" stroke-width="2.5" fill="none" marker-end="url(#tw)"/><path d="M816 154 H826" stroke="#a78bfa" stroke-width="2.5" fill="none" marker-end="url(#tw)"/><path d="M952 154 H962" stroke="#a78bfa" stroke-width="2.5" fill="none" marker-end="url(#tw)"/>
<text x="550" y="250" font-size="14" fill="#fbbf24">Stop and revise if validation fails or approval is withheld</text><text x="550" y="280" font-size="13" fill="#94a3b8">CI never runs terraform apply. Applying infrastructure may create billable AWS resources.</text></g></svg>