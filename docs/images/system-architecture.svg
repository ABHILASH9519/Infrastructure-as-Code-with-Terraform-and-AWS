<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="560" viewBox="0 0 1100 560" role="img" aria-labelledby="title desc">
<title id="title">Terraform AWS infrastructure architecture</title><desc id="desc">Separate dev and prod roots compose reusable network and optional compute modules. Network creates VPC, public and private subnets and internet gateway. Optional EC2 uses a private address, IMDSv2 and encrypted EBS. GitHub Actions validates Terraform and runs Checkov.</desc>
<rect width="1100" height="560" rx="22" fill="#0b1220"/><text x="44" y="48" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#f8fafc">Terraform + AWS — Architecture</text><text x="44" y="78" font-family="Arial,sans-serif" font-size="15" fill="#94a3b8">Reusable modules · separate environments · security-conscious defaults</text><defs><marker id="t" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#a78bfa"/></marker></defs><g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="55" y="125" width="205" height="68" rx="12" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/><text x="157" y="153" fill="#ede9fe">environments/dev</text><text x="157" y="174" font-size="13" fill="#ddd6fe">root module</text>
<rect x="55" y="220" width="205" height="68" rx="12" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/><text x="157" y="248" fill="#ede9fe">environments/prod</text><text x="157" y="269" font-size="13" fill="#ddd6fe">root module</text>
<rect x="350" y="160" width="225" height="85" rx="12" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="462" y="192" fill="#dbeafe">Network module</text><text x="462" y="215" font-size="13" fill="#bfdbfe">VPC + subnets + routes</text>
<rect x="350" y="300" width="225" height="85" rx="12" fill="#172554" stroke="#60a5fa" stroke-width="2"/><text x="462" y="332" fill="#dbeafe">Optional compute</text><text x="462" y="355" font-size="13" fill="#bfdbfe">EC2 disabled by default</text>
<path d="M260 159 H305 V195 H345 M260 254 H305 V210 H345 M260 159 H305 V340 H345 M260 254 H305 V340 H345" stroke="#a78bfa" stroke-width="2.5" fill="none" marker-end="url(#t)"/>
<rect x="665" y="115" width="360" height="280" rx="18" fill="#111827" stroke="#64748b" stroke-width="2"/><text x="845" y="145" font-size="18" font-weight="700" fill="#f8fafc">AWS VPC</text>
<rect x="695" y="165" width="140" height="75" rx="10" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="765" y="194" fill="#d1fae5">Public subnets</text><text x="765" y="215" font-size="12" fill="#a7f3d0">route table</text>
<rect x="855" y="165" width="140" height="75" rx="10" fill="#052e2b" stroke="#34d399" stroke-width="2"/><text x="925" y="194" fill="#d1fae5">Private subnets</text><text x="925" y="215" font-size="12" fill="#a7f3d0">route table</text>
<rect x="725" y="275" width="270" height="90" rx="10" fill="#1e3a8a" stroke="#60a5fa" stroke-width="2"/><text x="860" y="304" fill="#dbeafe">Optional EC2 instance</text><text x="860" y="326" font-size="13" fill="#bfdbfe">no public IP · IMDSv2 required</text><text x="860" y="347" font-size="13" fill="#bfdbfe">encrypted root EBS · restricted ingress</text>
<path d="M575 200 H625 V195 H660 M575 342 H625 V320 H720" stroke="#a78bfa" stroke-width="2.5" fill="none" marker-end="url(#t)"/>
<rect x="55" y="435" width="970" height="72" rx="12" fill="#422006" stroke="#f59e0b" stroke-width="2"/><text x="540" y="465" fill="#fef3c7" font-size="17">GitHub Actions: terraform fmt → backend-free init → validate → Checkov</text><text x="540" y="487" fill="#fde68a" font-size="13">Validation only — no AWS apply, live deployment, or cost-incurring resource creation</text></g></svg>